<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cala Studio | Silicon Valley</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --text: #111;
            --accent: #6366f1;
            --muted: #888;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .content { width: 100%; max-width: 800px; padding: 40px; }
        .header { 
            font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2em; 
            color: var(--muted); text-transform: uppercase; margin-bottom: 60px;
        }
        .manifesto { display: flex; flex-direction: column; gap: 5px; }
        .row { display: flex; align-items: baseline; cursor: pointer; transition: 0.3s; }
        .initial { 
            font-size: clamp(4rem, 12vw, 8rem); font-weight: 900; 
            line-height: 0.9; letter-spacing: -2px; 
        }
        .word { 
            font-size: clamp(1rem, 3vw, 2rem); font-weight: 200; 
            margin-left: 20px; letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--muted); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .row:hover .initial { color: var(--accent); transform: translateX(10px); }
        .row:hover .word { color: var(--text); letter-spacing: 0.6em; margin-left: 35px; opacity: 1; }
        .footer { margin-top: 60px; font-size: 0.85rem; color: var(--muted); opacity: 0.7; }
    </style>
</head>
<body>
    <div class="content">
        <div class="header">Cala Studio | Silicon Valley</div>
        <div class="manifesto">
            <div class="row"><span class="initial">C</span><span class="word">reative</span></div>
            <div class="row"><span class="initial">A</span><span class="word">lgorithmic</span></div>
            <div class="row"><span class="initial">L</span><span class="word">ogic</span></div>
            <div class="row"><span class="initial">A</span><span class="word">esthetic</span></div>
        </div>
        <p class="footer">// Site is under construction.</p>
        <p class="footer">// 2026</p>
    </div>
</body>
</html>
