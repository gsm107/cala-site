<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cala Studio | Silicon Valley</title>

    <link rel="icon" type="image/png" href="/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Cala" />
    <link rel="manifest" href="/my-favicon/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-content">
                <img id="cala_logo" src="img/cala_logo.png" alt="Cala Studio Logo" class="logo" />
                <div class="location">Cala Studio | Silicon Valley</div>
                <div class="manifesto">
                    <div class="item"><span class="initial">C</span><span class="full-text">reative</span></div>
                    <div class="item"><span class="initial">A</span><span class="full-text">lgorithmic</span></div>
                    <div class="item"><span class="initial">L</span><span class="full-text">ogic</span></div>
                    <div class="item"><span class="initial">A</span><span class="full-text">esthetic</span></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <nav class="section-nav">
                <a href="#introduction" class="nav-item" data-section="introduction">Introduction</a>
                <a href="#products" class="nav-item" data-section="products">Products</a>
                <a href="#philosophy" class="nav-item" data-section="philosophy">Philosophy</a>
                <a href="#services" class="nav-item" data-section="services">Services</a>
                <a href="#contact" class="nav-item" data-section="contact">Contact</a>
                
                <!-- Hover Preview Block -->
                <div class="nav-preview" id="nav-preview">
                    <div class="preview-content" id="preview-content"></div>
                </div>
            </nav>

            <footer class="site-footer">
                <p class="footer-text">
                    2026 © Cala Studio. All rights reserved. | 
                    Last updated: <span id="last-update"></span>
                </p>
            </footer>
        </main>
    </div>

    <script>
        // 显示最后更新时间
        const lastUpdateElement = document.getElementById('last-update');
        const lastModified = new Date(document.lastModified);
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
        const dateStr = lastModified.toLocaleDateString('en-US', dateOptions);
        const timeStr = lastModified.toLocaleTimeString('en-US', timeOptions);
        lastUpdateElement.textContent = dateStr + ' ' + timeStr;

        // Apple-style hover preview
        document.addEventListener('DOMContentLoaded', function() {
            const navItems = document.querySelectorAll('.nav-item');
            const navPreview = document.getElementById('nav-preview');
            const previewContent = document.getElementById('preview-content');
            
            if (!navPreview || !previewContent) {
                console.error('Preview elements not found');
                return;
            }
            
            // Section data
            const sectionData = {
                introduction: ['Background', 'Achievement'],
                products: ['TapEat', 'TapMeet'],
                philosophy: ['Creative', 'Algorithmic', 'Logic', 'Aesthetic'],
                services: ['management', 'design'],
                contact: ['email', 'address']
            };

            let currentSection = null;
            let hideTimeout = null;

            function showPreview(sectionId, navItem) {
                if (currentSection === sectionId) return;
                
                currentSection = sectionId;
                const items = sectionData[sectionId] || [];
                
                if (items.length === 0) return;
                
                // Position preview relative to the hovered nav item
                if (navItem) {
                    const navRect = navItem.getBoundingClientRect();
                    const navParent = navItem.closest('.section-nav');
                    const parentRect = navParent.getBoundingClientRect();
                    
                    // Calculate left position relative to nav parent
                    const leftOffset = navRect.left - parentRect.left;
                    navPreview.style.left = leftOffset + 'px';
                }
                
                // Update content with fade effect
                previewContent.style.opacity = '0';
                setTimeout(() => {
                    previewContent.innerHTML = items.map(item => `
                        <div class="preview-list-item">
                            <div class="preview-item-text">${item}</div>
                        </div>
                    `).join('');
                    previewContent.style.opacity = '1';
                }, 90);
                
                // Show preview block
                navPreview.classList.add('active');
                
                // Clear any pending hide
                if (hideTimeout) {
                    clearTimeout(hideTimeout);
                    hideTimeout = null;
                }
            }

            function hidePreview() {
                hideTimeout = setTimeout(() => {
                    // Double check if mouse is still over nav or preview
                    const isOverNav = Array.from(navItems).some(item => 
                        item.matches(':hover')
                    );
                    const isOverPreview = navPreview.matches(':hover');
                    
                    if (!isOverNav && !isOverPreview) {
                        navPreview.classList.remove('active');
                        currentSection = null;
                    }
                }, 200);
            }

            // Add hover events to nav items
            navItems.forEach(item => {
                const sectionId = item.getAttribute('data-section');
                
                if (!sectionId) {
                    console.warn('Nav item missing data-section:', item);
                    return;
                }
                
                item.addEventListener('mouseenter', (e) => {
                    e.preventDefault();
                    if (hideTimeout) {
                        clearTimeout(hideTimeout);
                        hideTimeout = null;
                    }
                    showPreview(sectionId, item);
                });
                
                item.addEventListener('mouseleave', () => {
                    hidePreview();
                });
            });

            // Keep preview visible when hovering over it
            navPreview.addEventListener('mouseenter', () => {
                if (hideTimeout) {
                    clearTimeout(hideTimeout);
                    hideTimeout = null;
                }
            });

            navPreview.addEventListener('mouseleave', () => {
                hidePreview();
            });
        });
    </script>

</body>
</html>
