<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cala Studio | Sunming</title>
    <style>
        :root {
            --bg: #f4f4f7;
            --text-main: #1a1a1a;
            --accent: #6366f1;
            --text-muted: #888;
            --sidebar-width: 40%;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            background-color: var(--bg); 
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 布局容器 */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧固定栏 */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10%;
            border-right: 1px solid #e5e5e5;
        }

        /* 右侧滚动内容区 */
        .main-content {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            padding: 10% 15% 10% 10%;
        }

        /* 继承你之前的 CALA 样式 */
        .location {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .manifesto .item {
            display: flex;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .initial {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            line-height: 1;
        }

        .full-text {
            font-size: 1rem;
            font-weight: 200;
            color: var(--text-muted);
            margin-left: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* 内容板块样式 */
        section { margin-bottom: 80px; opacity: 0.9; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
        .bio { font-size: 1.1rem; font-weight: 300; }
        .experience-item { margin-bottom: 30px; }
        .tag { 
            display: inline-block; 
            padding: 4px 12px; 
            background: #eef2ff; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            color: var(--accent);
            margin-right: 10px;
        }

        /* 响应式：手机端变回竖排 */
        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { position: relative; width: 100%; height: auto; border-right: none; padding: 60px 20px; }
            .main-content { margin-left: 0; width: 100%; padding: 40px 20px; }
        }
    </style>
</head>
