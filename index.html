<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cala Studio | Silicon Valley</title>

    <link rel="icon" type="image/png" href="/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Cala" />
    <link rel="manifest" href="/my-favicon/site.webmanifest" />

    <style>
        :root {
            --bg: #f4f4f7;
            --text-main: #1a1a1a;
            --accent: #6366f1; /* 活力紫 */
            --text-muted: #888;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: var(--bg); 
            color: var(--text-main);
            overflow: hidden;
        }

        .container { 
            text-align: left; 
            padding: 20px; 
            max-width: 800px;
        }

        /* 顶部小标题 */
        .location {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
        }

        .location::before {
            content: "";
            width: 20px;
            height: 1px;
            background: var(--text-muted);
            margin-right: 10px;
        }

        /* CALA 核心展示区 */
        .manifesto {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: baseline;
            cursor: pointer;
        }

        .initial {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -2px;
            transition: color 0.3s ease;
        }

        .full-text {
            font-size: clamp(0.8rem, 2vw, 1.8rem);
            font-weight: 200;
            color: var(--text-muted);
            margin-left: 15px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: color 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.6;
            transform-origin: left center;
        }

        /* 交互动效 */
        .item:hover .initial {
            color: var(--accent);
        }

        .item:hover .full-text {
            color: var(--text-main);
            opacity: 1;
            transform: scaleX(1.2);
        }

        /* 底部状态 */
        .status { 
            margin-top: 60px; 
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="location">Cala Studio | Silicon Valley</div>
        
        <div class="manifesto">
            <div class="item">
                <span class="initial">C</span>
                <span class="full-text">reative</span>
            </div>
            <div class="item">
                <span class="initial">A</span>
                <span class="full-text">lgorithmic</span>
            </div>
            <div class="item">
                <span class="initial">L</span>
                <span class="full-text">ogic</span>
            </div>
            <div class="item">
                <span class="initial">A</span>
                <span class="full-text">esthetic</span>
            </div>
        </div>

        <p class="status">
            © 2026 Cala Studio. All rights reserved. | 
            Last updated: <span id="last-update"></span>
        </p>
    </div>

    <script>
        // 显示最后更新时间（硬编码时间戳，用于标记代码修改时间）
        const lastUpdateElement = document.getElementById('last-update');
        // 更新时间戳：2026-01-27 19:33 洛杉矶时间 (PST)
        // 使用洛杉矶时间显示
        const lastModified = new Date('2026-01-27T19:33:00-08:00');
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'America/Los_Angeles' };
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Los_Angeles' };
        const dateStr = lastModified.toLocaleDateString('en-US', dateOptions);
        const timeStr = lastModified.toLocaleTimeString('en-US', timeOptions);
        lastUpdateElement.textContent = dateStr + ' ' + timeStr + ' (PST)';
    </script>
</body>
</html>
